<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Checkout | The Shoes Rack</title><meta name="description" content="Checkout"><link rel="icon" type="image/svg+xml" href="assets/logo/logo.svg"><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700;800&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="css/style.css"><link rel="stylesheet" href="css/responsive.css"><link rel="stylesheet" href="css/animations.css"></head><body data-root=""><a class="skip" href="#main">Skip to content</a><div id="site-header"></div><main id="main"><section class="wrap pg"><h1>Checkout</h1><div class="cof"><form id="cof" novalidate><h2>Delivery details</h2><label>Full name<input name="n" required autocomplete="name"></label><label>Mobile<input name="m" required pattern="[0-9]{10}" inputmode="numeric" autocomplete="tel"></label><label>Email<input name="e" type="email" required autocomplete="email"></label><label>Address<textarea name="a" required></textarea></label><div class="two"><label>City<input name="c" required></label><label>State<input name="s" required></label></div><label>PIN code<input name="p" required pattern="[0-9]{6}" inputmode="numeric"></label><label>Order note (optional)<textarea name="o" placeholder="Landmark, delivery time, etc."></textarea></label><h2>Payment preference</h2><fieldset><legend class="sr">Payment method</legend><label class="rd"><input type="radio" name="pay" value="UPI" checked> UPI</label><label class="rd"><input type="radio" name="pay" value="Card"> Card</label><label class="rd"><input type="radio" name="pay" value="COD"> Cash on delivery</label></fieldset><p class="note">No payment is taken on this website. Your order is sent to our WhatsApp, and we confirm it and share payment details there. [Edit this text]</p><button class="btn" type="submit">ORDER ON WHATSAPP</button></form><aside class="sum" id="cosum"></aside></div><div id="done" hidden></div></section></main><div id="site-footer"></div><script src="js/config.js"></script><script src="js/products-data.js"></script><script src="js/products.js"></script><script src="js/main.js"></script><script src="js/wishlist.js"></script><script src="js/cart.js"></script><script src="js/search.js"></script><script src="js/product.js"></script><script src="js/shop.js"></script><script src="js/checkout.js"></script></body></html>
